[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchproof"
version = "0.1.0"
description = "Security Rules That Generate Regression Tests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Akshit Srijan", email = "akshitsrijan001@gmail.com" },
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "flask>=3.0.0",
    "pytest>=7.0.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.0",
]

[project.scripts]
patchproof = "patchproof.cli:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
llm = [
    "anthropic>=0.18.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
